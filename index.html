<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Structural Acoustics, Understood — an interactive engineering reference for vibration, shock, acoustics, structural dynamics, and aerospace vibroacoustics." />
  <meta name="theme-color" content="#04101f" />
  <meta name="color-scheme" content="dark light" />
  <script data-theme-bootstrap>
    (() => {
      const key = 'sau-color-theme-v1';
      let theme = 'dark';
      try {
        const stored = localStorage.getItem(key);
        theme = stored === 'light' || stored === 'dark'
          ? stored
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch {}
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#04101f' : '#f3efe6');
    })();
  </script>
  <title>Structural Acoustics, Understood</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main-content" data-scroll-target="main-content">Skip to content</a>
  <div id="app"></div>
  <noscript>This site requires JavaScript for the calculators and interactive demonstrations.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
